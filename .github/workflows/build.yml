name: Build signed Lithium APK

on:
  workflow_dispatch:
    inputs:
      skip_setup:
        description: Skip setup?
        type: boolean
        default: false
permissions:
  contents: write

env:
  VERSION: "138.0.7204.157"

jobs:

  # Job 0: Dummy entry point 
  start:
    name: "post_check"
    runs-on: ubuntu-latest
    steps:
      - name: Report
        run: |
          if [ "${{ inputs.skip_setup }}" == "true" ]; then
            echo "skip_setup=true —  ⚠️Setup skipped - using cached depot_tools"
          fi
  # Job 1: Sync & Generate
  setup:
    name: "syncing_and_gn_gen"
    runs-on: ubuntu-latest
    needs: start
    if: ${{ inputs.skip_setup != true }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space (safe)
        run: |
          echo "=== Disk before cleanup ==="
          df -h /
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/.ghcup
          sudo rm -rf /usr/share/swift
          sudo rm -rf /usr/local/share/powershell
          sudo rm -rf /usr/share/miniconda
          sudo rm -rf /usr/local/aws-cli
          sudo rm -rf /usr/local/aws-sam-cli
          sudo rm -rf /usr/local/lib/node_modules
          sudo rm -rf /usr/local/share/chromium 
          sudo rm -rf /usr/share/gradle-*
          sudo rm -rf /usr/share/java
          sudo docker image prune --all --force || true
          sudo swapoff -a && sudo rm -f /mnt/swapfile || true
          sudo apt-get clean || true
          echo "=== Disk after cleanup ==="
          df -h /

      - name: Cache depot_tools
        uses: actions/cache@v4
        with:
          path: depot_tools
          key: depot_tools-${{ env.VERSION }}

      - name: Run setup
        run: |
          chmod +x *.sh
          ./setup.sh
          
      - name: Save depot_tools cache
        uses: actions/cache/save@v4
        if: always()
        with:
          path: depot_tools
          key: depot_tools-${{ env.VERSION }}

  #  Job 2: Compile 
  compile:
    name: "compiling"
    runs-on: ubuntu-latest
    needs: [start, setup]
    if: always() && needs.start.result == 'success' && needs.setup.result != 'failure'
 
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space (safe)
        run: |
          echo "=== Disk before cleanup ==="
          df -h /
          # Safe to remove — no impact on Chromium build tools
          # NOTE: We keep /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/.ghcup
          sudo rm -rf /usr/share/swift
          sudo rm -rf /usr/local/share/powershell
          sudo rm -rf /usr/share/miniconda
          sudo rm -rf /usr/local/aws-cli
          sudo rm -rf /usr/local/aws-sam-cli
          sudo rm -rf /usr/local/lib/node_modules
          sudo rm -rf /usr/local/share/chromium
          sudo rm -rf /usr/share/gradle-*
          sudo rm -rf /usr/share/java
          sudo docker image prune --all --force || true
          sudo swapoff -a && sudo rm -f /mnt/swapfile || true
          sudo apt-get clean || true
          echo "=== Disk after cleanup ==="
          df -h /

      - name: Restore depot_tools
        uses: actions/cache@v4
        with:
          path: depot_tools
          key: depot_tools-${{ env.VERSION }}

      - name: Restore siso cache
        uses: actions/cache@v4
        with:
         path: |
            chromium/src/out/Default/.siso_deps
            chromium/src/out/Default/.siso_state
            chromium/src/out/Default/.ninja_log
            chromium/src/out/Default/obj
            chromium/src/out/Default/gen
            chromium/src/out/Default/*.ninja
            chromium/src/third_party/llvm-build
            chromium/src/third_party/android_ndk
         key: siso-${{ env.VERSION }}-${{ github.run_number }}
         restore-keys: |
          siso-${{ env.VERSION }}-

      - name: Run compile
        run: |
          chmod +x *.sh
          ./compile.sh

      - name: Save siso cache
        uses: actions/cache/save@v4
        if: always()
        with:
         path: |
            chromium/src/out/Default/.siso_deps
            chromium/src/out/Default/.siso_state
            chromium/src/out/Default/.ninja_log
            chromium/src/out/Default/obj
            chromium/src/out/Default/gen
            chromium/src/out/Default/*.ninja
            chromium/src/third_party/llvm-build
            chromium/src/third_party/android_ndk
         key: siso-${{ env.VERSION }}-${{ github.run_number }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-apk
          path: chromium/src/out/tmp/*.apk
          retention-days: 1

      - name: Upload siso logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
         name: siso-logs
         path: |
          chromium/src/out/Default/siso_output
          chromium/src/out/Default/siso.INFO
          chromium/src/out/Default/siso_failed_commands.sh
         retention-days: 1

  # Sign & Release 
  sign:
    name: "signing_and_release"
    runs-on: ubuntu-latest
    needs: compile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download unsigned APK
        uses: actions/download-artifact@v4
        with:
          name: unsigned-apk
          path: chromium/src/out/tmp

      - name: Sign & Release
        env:
          KEYSTORE_JKS: ${{ secrets.KEYSTORE_JKS }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          chmod +x *.sh
          ./sign.sh

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: lithium-apks-${{ github.run_number }}
          path: chromium/src/out/release/*.apk

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          files: chromium/src/out/release/*.apk
