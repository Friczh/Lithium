name: Build signed Lithium APK

on:
  workflow_dispatch:
    inputs:
      skip_setup:
        description: Skip setup?
        type: boolean
        default: false
      skip_cache:
        description: Skip cache restore (fresh build)?
        type: boolean
        default: false
      cache_run:
        description: "Specify cache number (0 = latest)"
        type: number
        default: 0
      skip_caching:
        description: Skip caching (Not recommended)?
        type: boolean
        default: false
permissions:
  contents: write

env:
  VERSION: "138.0.7204.157"
  WORK_DIR: /opt/lithium-build

jobs:

  # Job 0: Dummy entry point 
  start:
    name: "post_check"
    runs-on: ubuntu-latest
    steps:
      - name: Report
        run: |
          if [ "${{ inputs.skip_setup }}" == "true" ]; then
            echo "⚠️ Setup skipped - using cached depot_tools"
          else
            echo "ℹ️ Setup will be ran in this build"
          fi
          if [ "${{ inputs.skip_cache }}" == "true" ]; then
            echo "ℹ️ Cache skipped - building fresh"
          else
            echo "⚠️ Cache will be used in this build"
          fi
          if [ "${{ inputs.skip_cache }}" == "true" ]; then
            echo "⛔ Cache skipped - ignored specifying cache"
          elif [ "${{ inputs.cache_run }}" == "0" ]; then
            echo "ℹ️ Latest cache will be used"
          else
          echo "ℹ️ Cache #${{ inputs.cache_run }} will be used"
          fi
          if [ "${{ inputs.skip_caching }}" == "true" ]; then
            echo "⚠️ CACHING SKIPPED - NO CACHE WILL BE SAVED IN THIS BUILD!"
          else
            echo "ℹ️ Cache will be saved in this build"
          fi
  # Job 1: Sync & Generate
  setup:
    name: "syncing_and_gn_gen"
    runs-on: ubuntu-latest
    needs: start
    if: ${{ inputs.skip_setup != true }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: ${{ env.WORK_DIR }}/repo
      
      - name: Runner specs
        run: |
          echo "=== CPU ==="
          lscpu | grep -E "Model name|CPU\(s\)|Thread|Core"
          echo "=== RAM ==="
          free -h | awk 'NR==1{print} NR==2{printf "Total: %s | Available: %s\n", $2, $7}'
          echo "=== Storage ==="
          df -h /
          echo "=== OS ==="
          uname -a
          cat /etc/os-release | grep PRETTY_NAME

      - name: Free disk space (safe)
        run: |
          echo "=== Disk before cleanup ==="
          df -h /
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/.ghcup
          sudo rm -rf /usr/share/swift
          sudo rm -rf /usr/local/share/powershell
          sudo rm -rf /usr/share/miniconda
          sudo rm -rf /usr/local/aws-cli
          sudo rm -rf /usr/local/aws-sam-cli
          sudo rm -rf /usr/local/lib/node_modules
          sudo rm -rf /usr/local/share/chromium 
          sudo rm -rf /usr/share/gradle-*
          sudo rm -rf /usr/share/java
          sudo docker image prune --all --force || true
          sudo swapoff -a && sudo rm -f /mnt/swapfile || true
          sudo apt-get clean || true
          echo "=== Disk after cleanup ==="
          df -h /

      - name: Cache depot_tools
        uses: actions/cache@v4
        with:
          path: ${{ env.WORK_DIR }}/depot_tools
          key: depot_tools-${{ env.VERSION }}

      - name: Run setup
        run: |
          mkdir -p ${{ env.WORK_DIR }}
          cd ${{ env.WORK_DIR }}/repo
          chmod +x *.sh
          WORK_DIR=${{ env.WORK_DIR }} ./setup.sh
          
      - name: Save depot_tools cache
        uses: actions/cache/save@v4
        if: always()
        with:
          path: ${{ env.WORK_DIR }}/depot_tools
          key: depot_tools-${{ env.VERSION }}

  #  Job 2: Compile 
  compile:
    name: "compiling"
    runs-on: ubuntu-latest
    needs: [start, setup]
    if: always() && needs.start.result == 'success' && needs.setup.result != 'failure'
 
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: ${{ env.WORK_DIR }}/repo

      - name: Runner specs
        run: |
          echo "=== CPU ==="
          lscpu | grep -E "Model name|CPU\(s\)|Thread|Core"
          echo "=== RAM ==="
          free -h | awk 'NR==1{print} NR==2{printf "Total: %s | Available: %s\n", $2, $7}'
          echo "=== Storage ==="
          df -h /
          echo "=== OS ==="
          uname -a
          cat /etc/os-release | grep PRETTY_NAME

      - name: Free disk space (safe)
        run: |
          # Safe to remove — no impact on Chromium build tools
          # NOTE: We keep /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/.ghcup
          sudo rm -rf /usr/share/swift
          sudo rm -rf /usr/local/share/powershell
          sudo rm -rf /usr/share/miniconda
          sudo rm -rf /usr/local/aws-cli
          sudo rm -rf /usr/local/aws-sam-cli
          sudo rm -rf /usr/local/lib/node_modules
          sudo rm -rf /usr/local/share/chromium
          sudo rm -rf /usr/share/gradle-*
          sudo rm -rf /usr/share/java
          sudo docker image prune --all --force || true
          sudo swapoff -a && sudo rm -f /mnt/swapfile || true
          sudo apt-get clean || true
          echo "=== Disk after cleanup ==="
          df -h /

      - name: Restore depot_tools
        uses: actions/cache@v4
        with:
          path: ${{ env.WORK_DIR }}/depot_tools
          key: depot_tools-${{ env.VERSION }}

      - name: Run compile with fetch mode
        run: |
          mkdir -p ${{ env.WORK_DIR }}
          cd ${{ env.WORK_DIR }}/repo
          chmod +x *.sh
          WORK_DIR=${{ env.WORK_DIR }} ./compile.sh --fetch-only

      - name: Restore siso cache
        if: ${{ !inputs.skip_cache }}
        uses: actions/cache@v4
        with:
         path: |
            ${{ env.WORK_DIR }}/chromium/src/out/Default
            ${{ env.WORK_DIR }}/chromium/src/third_party/llvm-build
            ${{ env.WORK_DIR }}/chromium/src/third_party/android_ndk
         key: siso-${{ env.VERSION }}-${{ inputs.cache_run != 0 && inputs.cache_run || github.run_number }}
         restore-keys: |
          siso-${{ env.VERSION }}-

      - name: Run compile with build mode
        run: |
          cd ${{ env.WORK_DIR }}/repo
          WORK_DIR=${{ env.WORK_DIR }} ./compile.sh --build-only

      - name: Save siso cache
        if: always() && !inputs.skip_caching
        uses: actions/cache/save@v4
        with:
         path: |           
            ${{ env.WORK_DIR }}/chromium/src/out/Default
            ${{ env.WORK_DIR }}/chromium/src/third_party/llvm-build
            ${{ env.WORK_DIR }}/chromium/src/third_party/android_ndk
         key: siso-${{ env.VERSION }}-${{ github.run_number }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-apk
          path: ${{ env.WORK_DIR }}/chromium/src/out/tmp/*.apk
          retention-days: 1

      - name: Upload siso logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
         name: siso-logs
         path: |
            ${{ env.WORK_DIR }}/chromium/src/out/Default/siso_output
            ${{ env.WORK_DIR }}/chromium/src/out/Default/siso.INFO
            ${{ env.WORK_DIR }}/chromium/src/out/Default/siso_failed_commands.sh
         retention-days: 1

  # Sign & Release 
  sign:
    name: "signing_and_release"
    runs-on: ubuntu-latest
    needs: compile

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: ${{ env.WORK_DIR }}/repo

      - name: Download unsigned APK
        uses: actions/download-artifact@v4
        with:
          name: unsigned-apk
          path: chromium/src/out/tmp

      - name: Sign & Release
        env:
          KEYSTORE_JKS: ${{ secrets.KEYSTORE_JKS }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          chmod +x *.sh
          ./sign.sh

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: lithium-apks-${{ github.run_number }}
          path: chromium/src/out/release/*.apk

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          files: chromium/src/out/release/*.apk
